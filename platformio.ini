[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Default is 133MHz. S3M playback under full ~12-13 channel polyphony was
; measured CPU-bound at ~97% of the real-time budget just for per-sample
; mixing (see s3m_file.cpp's diagnostic instrumentation) -- there's no
; more low-risk software headroom left to find there. 200MHz is a common,
; well-supported RP2040 overclock (the earlephilhower core auto-bumps the
; voltage regulator for F_CPU > 133MHz, see cores/rp2040/main.cpp) and
; buys ~50% more cycles/sample, which should clear the ceiling outright.
; Back off toward 133000000L if this causes any instability (USB dropouts,
; SD card errors, garbled display) -- those share clock-derived timing
; that hasn't been stress-tested at this speed yet.
board_build.f_cpu = 200000000L

; The earlephilhower core appends its own -Os AFTER our build_flags on the
; actual compiler command line, so an -O2 in build_flags alone is silently
; overridden (GCC uses whichever -O flag appears last). build_unflags
; strips that -Os first so our -O2 (below, in build_flags) is the only -O
; flag left and actually takes effect.
build_unflags = -Os

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    greiman/SdFat@^2.2.0
    FortySevenEffects/MIDI Library@^5.0.0
    adafruit/Adafruit TinyUSB Library

; Adafruit TinyUSB Library transitively depends on "SdFat - Adafruit Fork",
; which has the exact same header layout as greiman/SdFat above. With both
; on the include path, headers like FsFile.h cross-resolve into the wrong
; library's directory and every SdFat class/constant gets defined twice.
; We only ever use greiman/SdFat (SdFs/FsFile, SD_FAT_TYPE=3 below), so drop
; the fork to keep a single definition on the include path.
lib_ignore =
    SdFat - Adafruit Fork

build_flags =
    ; -O2 (speed) instead of the earlephilhower core's default -Os (size).
    ; Flash usage is ~11% of 2MB -- there's no size pressure at all, while
    ; S3M playback under full ~10-channel polyphony was measured CPU-
    ; bound (per-sample mixing/resampling dominates, not SD access or
    ; pattern decode -- see s3m_file.cpp's diagnostic instrumentation).
    ; -O2 enables more aggressive inlining and loop optimization that -Os
    ; deliberately forgoes to keep code small, directly targeting that
    ; bottleneck for free, with no source changes.
    -O2

    ; ---- TFT_eSPI config (ST7789, 240x320) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; TFT SPI pins
    -D TFT_MISO=28
    -D TFT_MOSI=27
    -D TFT_SCLK=26
    -D TFT_CS=20
    -D TFT_DC=21
    -D TFT_RST=22
    -D TFT_SPI_PORT=1

    ; 20MHz confirmed working on this board; 40MHz also confirmed working
    ; for faster redraws. Now trying 75MHz -- the picoTracker v2 reference
    ; firmware (xiphonics/picoTracker, same ST7789 panel, see its
    ; platform.cpp) requests exactly this rate for its own display SPI, so
    ; this hardware is known to at least attempt it. Back off toward
    ; 40000000 (confirmed-good fallback) if the panel shows glitches/
    ; garbage -- TFT_eSPI's SPI_FREQUENCY is a request, not a guarantee;
    ; the RP2040 clock divider rounds to the nearest achievable rate, and
    ; signal integrity at this speed depends on wiring/trace length in a
    ; way the reference firmware's own board layout doesn't guarantee for
    ; every build of this one.
    -D SPI_FREQUENCY=75000000
    ; TFT_eSPI defaults ST7789 boards to SPI_MODE3 ("some ST7789 boards do
    ; not work with Mode 0" -- see TFT_eSPI.h). This panel is one of the
    ; ones that DOES need Mode 0 (confirmed via a known-working reference
    ; using this exact board's pins.h layout, which drives it with the
    ; pico-sdk's plain spi_init() -- Mode 0 by default, never overridden).
    ; Without this override the panel silently never wakes from sleep:
    ; backlight on, fully black screen, RDDPM register reads back
    ; abnormal. RP2040_PIO_SPI's custom PIO program bypassed TFT_SPI_MODE
    ; entirely with its own hardcoded timing, which is why this only
    ; surfaced after switching to hardware SPI (see the note above).
    -D TFT_SPI_MODE=SPI_MODE0
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; Deliberately NOT setting RP2040_PIO_SPI: TFT_MISO/MOSI/SCLK (28/27/26)
    ; are already RP2040's native SPI1 pins, so hardware SPI works fine.
    ; RP2040_PIO_SPI would make TFT_eSPI's own header auto-define
    ; RP2040_PIO_INTERFACE, switching the display to a PIO-based SPI
    ; driver that claims a PIO state machine -- starving the onboard synth
    ; (I2S, also PIO-based) of one, since SdFat's SDIO driver already
    ; claims an entire other PIO block for the SD card. Cost 3 diagnostic
    ; builds to track down; don't re-add without re-reading that history.

    ; ---- USB: composite CDC (serial console) + USB-MIDI ----
    -D USE_TINYUSB

    ; SdFat: SdFs/FsFile that transparently handles FAT16/FAT32 *and* exFAT
    -D SD_FAT_TYPE=3
